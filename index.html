<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mr. Agent</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='30' rx='24' ry='22' fill='%23f3f5f9'/%3E%3Crect x='14' y='22' width='36' height='16' rx='8' fill='%23050608'/%3E%3Ccircle cx='25' cy='30' r='3.5' fill='%2349e3ff'/%3E%3Ccircle cx='39' cy='30' r='3.5' fill='%2349e3ff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="stage"></div>

    <header class="hud card" id="status">
      <div class="who">
        <span class="dot"></span>
        <div>
          <h1>Mr. Agent</h1>
          <p id="activity">Booting…</p>
        </div>
      </div>
      <dl class="stats">
        <div><dt>Lines today</dt><dd id="st-lines">0</dd></div>
        <div><dt>Commits</dt><dd id="st-commits">0</dd></div>
        <div><dt>Matchas</dt><dd id="st-coffee">0</dd></div>
      </dl>
      <div id="energy" data-level="ok" title="Battery: matcha recharges it"><i></i></div>
      <div id="integrity" title="Body integrity" hidden><span>Integrity</span><i><b></b></i></div>
    </header>

    <nav class="hud card" id="controls" aria-label="Controls">
      <button data-act="mac" class="primary" title="Use the Mac (M)"><span class="ico">💻</span><span class="lbl">Use the Mac</span><kbd>M</kbd></button>
      <button data-act="chat" id="btn-chat" title="Talk to Mr. Agent (/)"><span class="ico">💬</span><span class="lbl">Talk</span><kbd>/</kbd></button>
      <span class="sep"></span>
      <button data-act="coffee" title="Matcha run (C)"><span class="ico">🍵</span><span class="lbl">Matcha</span><kbd>C</kbd></button>
      <button data-act="stretch" title="Stretch (Y)"><span class="ico">🙆</span><span class="lbl">Stretch</span><kbd>Y</kbd></button>
      <button data-act="window" title="Look out the window (O)"><span class="ico">🪟</span><span class="lbl">Window</span><kbd>O</kbd></button>
      <button data-act="dance" title="Dance break (N)"><span class="ico">🎶</span><span class="lbl">Dance</span><kbd>N</kbd></button>
      <button data-act="tv" title="Watch TV (G)"><span class="ico">📺</span><span class="lbl">TV</span><kbd>G</kbd></button>
      <button data-act="snack" title="Raid the fridge (B)"><span class="ico">🔋</span><span class="lbl">Fridge</span><kbd>B</kbd></button>
      <button data-act="tinker" title="Workshop (K)"><span class="ico">🛠</span><span class="lbl">Tinker</span><kbd>K</kbd></button>
      <button data-act="sleep" title="Nap (Z)"><span class="ico">😴</span><span class="lbl">Nap</span><kbd>Z</kbd></button>
      <button data-act="wave" title="Say hi (H)"><span class="ico">👋</span><span class="lbl">Wave</span><kbd>H</kbd></button>
      <span class="sep"></span>
      <button data-act="punch" id="btn-punch" title="Punch mode: click him to punch (P)"><span class="ico">🥊</span><span class="lbl">Punch</span><kbd>P</kbd></button>
      <button data-act="repair" id="btn-repair" title="Repair him (U)"><span class="ico">🔧</span><span class="lbl">Repair</span><kbd>U</kbd></button>
      <span class="sep"></span>
      <button data-act="time" id="btn-time" title="Time of day (T)"><span class="ico">🕒</span><span class="lbl">Real time</span><kbd>T</kbd></button>
      <button data-act="walls" id="btn-walls" title="Walls (X)"><span class="ico">🧱</span><span class="lbl">Cutaway</span><kbd>X</kbd></button>
      <button data-act="follow" id="btn-follow" title="Follow the robot (F)"><span class="ico">🎥</span><span class="lbl">Follow</span><kbd>F</kbd></button>
      <button data-act="reset" title="Reset view (R)"><span class="ico">↺</span><span class="lbl">View</span><kbd>R</kbd></button>
      <button data-act="sound" id="btn-sound" title="Sound (V)"><span class="ico">🔊</span><span class="lbl">Sound</span><kbd>V</kbd></button>
    </nav>

    <section class="hud card" id="chat" aria-label="Talk to Mr. Agent" hidden>
      <header><div id="chat-tabs"><button data-who="agent" class="on">🤖 Mr. Agent</button><button data-who="kuma">🐻 Kuma</button></div><button id="chat-close" title="Close (Esc)">✕</button></header>
      <div id="chat-brain"><span id="chat-model">🧠 MrAgent</span><button id="chat-load" hidden>Wake up MrAgent</button><div id="chat-bar" hidden><i></i></div></div>
      <div id="chat-log" class="chat-log"></div>
      <div id="chat-log-kuma" class="chat-log" hidden></div>
      <form id="chat-form" autocomplete="off"><input id="chat-input" placeholder="Ask him to go somewhere, make matcha, dance…" maxlength="300" /><button>Send</button></form>
    </section>

    <nav class="hud card" id="rooms" aria-label="Rooms"></nav>
    <div id="bubble" class="hud"></div>
    <div id="kbubble" class="hud bubble-kuma"></div>
    <div id="tip"></div>
    <div id="toast" class="hud"></div>
    <p class="hud" id="hint">WASD walk him around · / talk to him · drag to orbit · 0–7 rooms · click his MacBook or Kuma’s PC</p>

    <div id="mac" hidden></div>
    <div id="win" hidden></div>

    <div id="loader">
      <div class="logo"></div>
      <div class="bar"><i></i></div>
      <p class="msg">Loading parts from FreeCAD…</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
